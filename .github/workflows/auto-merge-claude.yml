name: Auto-merge branches to main

# Merges ALL branches (any prefix — claude/*, jack/*, etc.) into main automatically,
# but ONLY once their CI run is green. Full hands-off automation while ensuring a red
# build never lands on main.
#
# Why trigger on `workflow_run` (CI completed) instead of `push`:
#   Triggering when the "CI" workflow completes means (a) every drain happens with a
#   known CI result in hand, and (b) when a branch's CI later turns green, that
#   completion re-triggers this workflow and the branch gets picked up. No polling, no
#   stranded branches.
#
# NOTE: a `workflow_run`-triggered workflow only fires when this file is present on the
# repository's DEFAULT branch (main). So the very first branch must be merged into main
# manually (one PR) to bootstrap main with this workflow + CI; every branch after that
# is drained automatically once its CI is green.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}      # manual drain escape hatch

permissions:
  contents: write            # push merges to main, delete merged branches
  pull-requests: write       # the conflict fallback opens a PR
  actions: write             # read: the CI-gate reads workflow runs via the Actions API;
                             # write: the one-shot retry below calls `gh run rerun --failed`.

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge all CI-green branches into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # shellcheck source=scripts/auto_merge_decision.sh
          source scripts/auto_merge_decision.sh

          # Drain EVERY un-merged branch (any prefix), not just the one whose CI just
          # finished. The concurrency group (auto-merge-main) keeps only ONE run
          # pending, so rapid CI completions from several sessions can drop a queued
          # run. Processing all branches here means whichever run does execute also
          # picks up any stranded stragglers — a dropped queued run can no longer lose
          # a branch's work.
          if ! git fetch origin --prune; then
            echo "::warning::git fetch failed; the next CI completion re-triggers and drains."
            exit 0
          fi

          git checkout -B main origin/main

          # Every remote branch is a candidate EXCEPT main itself (nothing to merge main
          # into) and the origin/HEAD symbolic ref (not a real branch).
          merged_branches=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -v -E '^origin/(main|HEAD)$' || true); do
            br="${ref#origin/}"

            # Already contained in main (e.g. a prior run merged it): just clean up.
            if is_ancestor_of "$ref" main; then
              merged_branches="$merged_branches $br"
              continue
            fi

            # --- CI gate -------------------------------------------------------------
            # Only merge a branch whose EXACT tip commit has a successful CI run. We
            # query the latest "CI" workflow run for that precise SHA, so a commit
            # pushed after CI passed (new tip, no green run yet) is skipped until its
            # own CI completes green. Fail closed: any non-success (in-progress,
            # failure, missing, or API error) skips the branch. The fail-closed logic
            # lives in scripts/auto_merge_decision.sh and is covered by
            # tests/test_auto_merge_logic.sh — not just shellcheck syntax checks.
            sha="$(git rev-parse "$ref")"
            runs_json="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" \
              2>/dev/null || echo "")"
            ci_conclusion="$(ci_conclusion_from_json "$runs_json")"
            if ! is_ci_green "$ci_conclusion"; then
              # ONE-SHOT, CONTENT-FREE RETRY. A red-CI branch would otherwise sit parked
              # with no automated remediation, even for a transient/flaky failure.
              # should_retry_failed_ci bounds this to exactly ONE attempt ever per branch
              # (GitHub's own run_attempt counter is the idempotency marker — a rerun that
              # fails again reads attempt=2 and is never retried again); the rerun's own
              # completion re-triggers this workflow via the workflow_run trigger, so no
              # polling is needed.
              run_id="$(ci_run_id_from_json "$runs_json")"
              run_attempt="$(ci_run_attempt_from_json "$runs_json")"
              if should_retry_failed_ci "$ci_conclusion" "$run_attempt" && [ -n "$run_id" ]; then
                echo "::notice::$br — CI for ${sha:0:7} failed on attempt 1; requesting a one-shot re-run (run $run_id) before treating it as stranded."
                gh run rerun "$run_id" --failed 2>/dev/null \
                  || echo "::warning::Could not request a re-run for $br (run $run_id) — it stays parked until CI is green."
              fi
              echo "::notice::Skipping $br — CI for ${sha:0:7} is '$ci_conclusion', not success. It merges once its CI run completes green."
              continue
            fi

            # Fast-forward if possible, else a merge commit.
            if git merge --ff-only "$ref" || git merge --no-ff "$ref" -m "Auto-merge $br into main"; then
              merged_branches="$merged_branches $br"
            else
              git merge --abort || true
              if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
                echo "::error::merge abort failed for $br — repo still mid-merge (MERGE_HEAD present); stopping the drain now to avoid cascading false conflicts on subsequent branches in this loop." >&2
                exit 1
              fi
              echo "::warning::Unresolved conflict merging $br."
              gh pr create --base main --head "$br" \
                --title "Auto-merge conflict: $br" \
                --body "The auto-merge workflow hit a conflict it could not resolve automatically. Resolve manually and merge, or close if superseded." \
                || echo "PR already exists or could not be created."
            fi
          done

          if [ -z "${merged_branches// }" ]; then
            echo "No CI-green branches to merge."
            exit 0
          fi

          if ! git push origin main; then
            echo "::warning::push to main failed; branches left intact for the next run."
            exit 0
          fi

          # Delete each merged branch ONLY after re-confirming its current remote tip is
          # fully contained in the new main, so a commit pushed during the merge window
          # is never deleted unmerged — it's left for the next run.
          for br in $merged_branches; do
            git fetch origin "$br" >/dev/null 2>&1 || continue
            if is_ancestor_of "origin/$br" main; then
              git push origin --delete "$br" || true
            else
              echo "::warning::$br advanced during the merge; not deleting (next run merges it)."
            fi
          done
