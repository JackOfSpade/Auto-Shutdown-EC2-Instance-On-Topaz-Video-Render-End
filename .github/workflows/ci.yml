name: CI

on:
  push:
  pull_request:
  # Not merely a manual escape hatch: auto-merge-claude.yml pushes its merge
  # commit to main using GITHUB_TOKEN, and GitHub deliberately raises NO workflow
  # events for a GITHUB_TOKEN push (its recursion guard). So the merge commit
  # would get no CI run at all, and auto-merge's main-history gate — "the exact
  # current main SHA must be green before another branch is merged" — could never
  # be satisfied, deadlocking the drain after a single merge. This trigger is what
  # lets that workflow dispatch a CI run for the SHA it just pushed.
  # Note GitHub only offers workflow_dispatch for the copy of this file on the
  # default branch, which is exactly where the merge commit lands.
  workflow_dispatch: {}

# Every job below only checks out, lints, and tests; not one writes to the
# repository, so none needs more than read access to contents. Without this block
# they inherit the repository-default token scope, which matters because this
# workflow runs third-party code with that token in the environment (the
# actionlint container, PSGallery modules, PyPI wheels). Deliberately NOT copied
# to auto-merge-claude.yml, whose wider scope is required and justified there.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-lint:
    name: Shell + workflow checks (shellcheck, bash 3.2 lint, IAM JSON, bash tests, actionlint)
    runs-on: ubuntu-latest
    # Nothing here should take minutes. The default is GitHub's 360, and this job
    # does two unbounded network fetches (the shellcheck tarball, the actionlint
    # image pull); a repo whose entire premise is not paying for idle compute
    # should not leave a hung runner burning for six hours.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shellcheck
        # Pinned, and fetched from the upstream release rather than `apt-get
        # install shellcheck`, for two reasons. (1) apt resolves to whatever the
        # runner image's archive offers this week, so the bar this job holds the
        # tree to could move under a completely unrelated change — the same silent
        # redness the actionlint tag pin below exists to prevent. (2) 0.10.0 is
        # specifically the shellcheck bundled inside rhysd/actionlint:1.7.7, which
        # is what lints the bash embedded in workflow `run:` blocks — matching it
        # means .sh files on disk and bash inside a workflow are held to ONE
        # standard instead of two. Bump this and that tag together.
        # Resolve the runner architecture rather than assuming x86_64 so the
        # pinned binary remains usable if GitHub changes the hosted image.
        run: |
          set -euo pipefail
          ver=0.10.0
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64 | arm64) arch=aarch64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSLo /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${ver}/shellcheck-v${ver}.linux.${arch}.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${ver}/shellcheck" /usr/local/bin/shellcheck
          # Print it: a version that moves without anyone noticing is the exact
          # failure this pin exists to prevent, so make it visible every run.
          shellcheck --version

      - name: Run shellcheck
        # --source-path=SCRIPTDIR resolves each `# shellcheck source=` directive
        # relative to the sourcing file's own directory (so tests/ can follow
        # ../scripts/*.sh); without it shellcheck emits SC1091 and fails the job.
        # The file list is DISCOVERED rather than globbed by hand: the previous
        # four-glob list silently excluded tests/fixtures/*.sh, and those fixtures
        # are not throwaway stubs — fake-aws-scheduler.sh is what decides which arm
        # of the EventBridge-Scheduler-vs-CloudWatch-Events fallback the deploy test
        # actually exercises, so a quoting bug there turns a passing test into a
        # test of the wrong branch. Any new directory is now covered automatically.
        # .claude/ is excluded because this agent tooling keeps full repo copies in
        # .claude/worktrees/. An empty result makes shellcheck exit non-zero,
        # which is intended: a discovery gate that finds nothing has proved nothing.
        run: find . -name '*.sh' -not -path './.git/*' -not -path './.claude/*' -print0 | xargs -0 shellcheck -x --source-path=SCRIPTDIR

      - name: Run actionlint
        # Deliberately ordered here, ahead of the gates below: a workflow-YAML error invalidates every
        # one of them, and reporting it before the full bash suite saves time.
        # The shellcheck step above only covers standalone *.sh files on disk — it never sees the bash embedded
        # in the workflows' own `run:` blocks (e.g. the merge loop in auto-merge-claude.yml). actionlint
        # statically checks workflow YAML AND shells out to shellcheck on every embedded `run:` script,
        # so this is the only gate that covers that bash. Pinned to a specific tag (not `:latest`) so a
        # new actionlint release can't silently turn this job red on an unrelated change.
        uses: docker://rhysd/actionlint:1.7.7@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d # 1.7.7
        with:
          args: -color

      - name: Lint for bash-4-only syntax (these scripts must run on macOS bash 3.2)
        # The operator runs control-plane/ and scripts/ from a Mac, where /bin/bash
        # is still 3.2 — Apple never shipped bash 4 (GPLv3). `${var^^}` / `${var,,}`
        # case modification is a bash 4.0 feature, and on 3.2 it does not degrade:
        # it is a fatal "bad substitution" parse error that kills the script at the
        # point of use. shellcheck does NOT catch it by default (it assumes a modern
        # bash unless a file declares otherwise), so nothing else in this pipeline
        # would. One grep is the whole gate, and it is cheap enough to run on every
        # push. tests/ is included because the harnesses run on the same machine.
        # The ERE anchors the ^ / , operator immediately after the parameter name
        # (with an optional array subscript) so ordinary commas inside `${x:-a,b}`
        # or `${x//,/;}` are not false positives. Whole-line comments are filtered
        # OUT of the matches: the fix sites deliberately keep a rationale comment
        # naming the forbidden expansion right where the temptation to regress
        # lives (e.g. "tr, not ${VAR^^}: ..." in 00-verify-prerequisites.sh), and
        # a lint that forbids explaining itself would push that rationale out of
        # the scripts. Only pure `# ...` lines are exempt — the expansion after
        # code on a line, even ahead of a trailing comment, still fails.
        run: |
          set -euo pipefail
          matches="$(grep -rEn --include='*.sh' '\$\{[A-Za-z_][A-Za-z0-9_]*(\[[^]]*\])?(\^\^?|,,?)[^}]*\}' control-plane scripts tests | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::bash 4 only: the case-modification expansions shown above (\${var^^} / \${var,,}) are a parse error on macOS /bin/bash 3.2, which is where these scripts run. Use tr '[:lower:]' '[:upper:]' instead."
            exit 1
          fi

      - name: Assert operator-run scripts are executable
        # docs/11 tells the operator to invoke the numbered control-plane scripts
        # as `./control-plane/NN-*.sh`, and the bash suites the same way. Two of
        # the six numbered scripts were committed 644 once already (fixed
        # 2026-08-21): every doc'd invocation died with "permission denied" while
        # CI stayed green, because CI always ran them via `bash <file>`. Git
        # preserves the executable bit through clone/checkout, so asserting it
        # here keeps the committed modes from silently diverging again.
        run: |
          set -euo pipefail
          bad=0
          for f in control-plane/[0-9]*.sh tests/test_*.sh; do
            [ -f "$f" ] || continue
            if [ ! -x "$f" ]; then
              echo "::error file=$f::not executable — the documented ./$f invocation fails with 'permission denied'. Fix with: chmod +x $f && git add $f"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]
          echo "All operator-run scripts carry their executable bit."

      - name: Validate IAM policy JSON
        # control-plane/iam/*.json is handed verbatim to AWS via `file://` by
        # 02-create-iam-role.sh, 04-deploy-max-lifetime-lambda.sh and
        # 05-grant-audit-reads.sh, and nothing else in this pipeline parses JSON:
        # shellcheck reads .sh, PSScriptAnalyzer reads in-guest/, ruff reads
        # lambda/. A stray comma committed while editing a Statement block
        # therefore surfaces only mid-deploy, as an opaque MalformedPolicyDocument,
        # after 04-deploy has already tagged the instance, zipped the code and
        # created the role — leaving a half-provisioned control plane to unwind by
        # hand. These documents are also the tag-scoped guardrails that keep the
        # Lambda from stopping the wrong instance, so they are worth a parse check.
        # python3 is available on the GitHub-hosted runner.
        # rather than `jq empty`: json.load accepts exactly ONE document, while jq
        # happily accepts a stream, so a file that ended up with two concatenated
        # objects would pass jq and still be rejected by AWS.
        run: |
          set -euo pipefail
          checked=0
          for policy in control-plane/iam/*.json; do
            [ -f "$policy" ] || continue
            checked=$((checked + 1))
            if ! python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$policy"; then
              echo "::error file=$policy::not valid JSON — AWS would reject this mid-deploy with MalformedPolicyDocument."
              exit 1
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::No control-plane/iam/*.json matched — the policy documents moved, so this check proved nothing."
            exit 1
          fi
          echo "IAM policy documents parsed: $checked."

      - name: Run bash test suites
        # Discovered, not hand-listed. This used to be one copy-pasted step per
        # suite, which meant a new tests/test_*.sh was gated only if whoever wrote
        # it also remembered to edit this file. A safety net that silently is not
        # running is worse than an absent one (see docs/16-render-loss-incident.md),
        # so the glob picks up any suite the moment it lands.
        # Stops at the FIRST failing suite and names it, so the log points at the
        # culprit and not at the loop; an empty glob fails loudly rather than
        # reporting a vacuous pass.
        run: |
          set -euo pipefail
          ran=0
          for suite in tests/test_*.sh; do
            [ -f "$suite" ] || continue
            ran=$((ran + 1))
            echo "::group::$suite"
            if ! bash "$suite"; then
              echo "::endgroup::"
              echo "::error file=$suite::bash test suite failed: $suite"
              exit 1
            fi
            echo "::endgroup::"
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::No tests/test_*.sh suites matched — the discovery glob is broken, so this job proved nothing."
            exit 1
          fi
          echo "Bash test suites passed: $ran."

  powershell:
    name: PowerShell analyze + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # See the shell-lint job: Install-Module from PSGallery and the pwsh tarball
    # curl below are both unbounded network operations, and 360 idle minutes is
    # the wrong default for this repo of all repos.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PSScriptAnalyzer + Pester
        run: |
          # Record the GitHub-hosted PowerShell runtime. The floor is asserted
          # loosely (>= 7.4): hosted images can advance without weakening the
          # version this suite was reviewed on. Compared on Major/Minor rather than
          # cast to [version], because PSVersion is a SemanticVersion on pwsh 7 and
          # a preview build would not cast cleanly.
          # None of this says anything about Windows PowerShell 5.1, which this job
          # never runs; PSUseCompatibleSyntax below is what covers the 5.1 target.
          Write-Host "PowerShell host: $($PSVersionTable.PSVersion) on $($PSVersionTable.Platform)"
          $psv = $PSVersionTable.PSVersion
          if ($psv.Major -lt 7 -or ($psv.Major -eq 7 -and $psv.Minor -lt 4)) {
              throw "This job needs pwsh 7.4 or newer, but is running $psv."
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # Versions are intentional: PSScriptAnalyzer 1.25.0 is the reviewed
          # version used to establish the warning allowlist below. Pester 5.7.1
          # is the reviewed v5 runner required by this suite's CI interface.
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run PSScriptAnalyzer (Error/ParseError + non-allowlisted Warnings fail the build)
        run: |
          # Install-Module alone does not control module auto-loading when the
          # runner also has another version available. Import and assert the
          # exact reviewed analyzer before evaluating its diagnostics.
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $analyzerVersion = (Get-Module -Name PSScriptAnalyzer).Version.ToString()
          if ($analyzerVersion -ne '1.25.0') {
              throw "Expected PSScriptAnalyzer 1.25.0, but loaded $analyzerVersion."
          }

          # This gate must catch real correctness/best-practice issues, not just parse errors, so
          # Warning severity fails the build too UNLESS the rule is explicitly allowlisted below.
          # Only add a rule here when the in-guest tree triggers it because of a DELIBERATE design
          # choice (verified against the current tree, not assumed) — never to silence a real finding.
          # Never allowlist a security-class rule (credential/secret handling, injection, etc.).
          # Each entry below enumerates EVERY site it silences, so a reviewer can diff the list
          # against the tree instead of trusting a summary. Sites are named by file + function
          # rather than file:line, because line numbers rot on the first unrelated edit above them.
          # Re-derive the authoritative list before touching this block:
          #   Invoke-ScriptAnalyzer -Path in-guest -Recurse -Severity Warning |
          #     ForEach-Object { '{0}:{1} {2}' -f (Split-Path $_.ScriptPath -Leaf), $_.Line, $_.RuleName }
          $allowedWarningRules = @(
              # Seven sites, four kinds, all deliberate:
              #  - Config.ps1 / Write-TopazLog x1, the `(Get-TopazAutoStopConfig).LogDir` read.
              #    A config that fails validation is exactly the case the literal LogDir fallback
              #    on the line above exists for, and the caller has already had the message on the
              #    stream, so there is nothing to recover and nothing new to say. Re-logging here
              #    would fire on EVERY line of an otherwise-usable log; the rationale is written out
              #    in full at the catch itself.
              #  - Config.ps1 / Get-Ec2Identity x3 (the instance-id, placement/region and
              #    availability-zone IMDS lookups): IMDS being unreachable is an expected, handled
              #    case - the caller gets $null, as Get-Ec2Identity's own .DESCRIPTION states.
              #  - Config.ps1 / Get-GpuUtilizationMax and Config.ps1 / Invoke-TopazAwsCli x1 each:
              #    `try { $proc.Kill() } catch { }` after WaitForExit timed out. The process is
              #    already being abandoned and the TIMEOUT is what gets reported (Invoke-TopazAwsCli
              #    WARN-logs it; Get-GpuUtilizationMax returns $null, which its callers treat as
              #    "no reading"), so a Kill that merely raced the process's own exit has nothing to add.
              #  - Register-ScheduledTasks.ps1 x1, the Stop-ScheduledTask issued before
              #    Unregister-ScheduledTask. This is the one entry here that is NOT cosmetic, and the
              #    first place to look if this rule is ever un-allowlisted: the comment directly above
              #    that call documents the orphaned-watchdog hazard the Stop exists to prevent (two
              #    watchdogs on one render, each independently invoking Stop-Sequence.ps1). It stays
              #    allowlisted because Stop-ScheduledTask also throws for the ordinary "registered but
              #    not currently running" case, and because the very next line unregisters with
              #    -ErrorAction Stop - so a task that cannot be torn down at all still fails loudly
              #    instead of being quietly re-registered alongside its own orphan.
              'PSAvoidUsingEmptyCatchBlock',
              # Eleven sites, all plural because the name describes what the function RETURNS and
              # the singular form would misdescribe it. Watchdog.ps1: Get-TopazPids, Get-TopazWorkers,
              # Get-WorkerIoBytes, Get-OutputBytes, Resolve-ProcessDescendants. Config.ps1:
              # Get-TopazOutputFiles, Build-AwsCliArgs, Build-RcloneLogFileArgs,
              # Get-TopazRcloneCommonArgs, Get-TopazRcloneTuningArgs, Find-RenderRecoveryCandidates.
              # Each returns a collection, an argument list, or a byte total;
              # "Pid"/"Worker"/"Byte"/"Arg"/"File"/"Descendant"/"Candidate" would name a single item
              # none of them ever returns. The two Rclone*Args builders are the same case as
              # Build-AwsCliArgs: both hand back the shared argument ARRAY every rclone invocation
              # splats, so the singular would describe a single flag.
              'PSUseSingularNouns'
          )

          # PSUseCompatibleSyntax is the ONLY automated check anywhere in this repo that the in-guest
          # scripts still PARSE under Windows PowerShell 5.1. That gap matters more here than any
          # other: 5.1 is what the EC2 Windows Server guest actually runs, while every runner in this
          # file - and Pester, and the developer's Mac - is pwsh 7, so a PS7-only construct (`??`,
          # `?.`, ternary, `?[]`) sails through every other gate green. On 5.1 it is not a runtime
          # warning, it is a parse error that takes down the WHOLE file; and since every in-guest
          # script dot-sources Config.ps1 by literal name, one such construct there stops Watchdog.ps1
          # from starting at all - the render is never signalled complete and the GPU instance bills
          # until a human notices.
          # The rule is opt-in: it does not fire from the default rule set, which is the only reason
          # -Settings exists here. It reports at Error severity, so the blocking filter below already
          # fails the build on it with no allowlist change needed. Verified when added: enabling it
          # produced ZERO new diagnostics against the then-current in-guest tree, so it gates future
          # code without re-litigating existing code.
          $compatSettings = @{
              Rules = @{
                  PSUseCompatibleSyntax = @{
                      Enable         = $true
                      TargetVersions = @('5.1', '7.0')
                  }
              }
          }

          $results = Invoke-ScriptAnalyzer -Path in-guest -Recurse -Settings $compatSettings
          $results | Format-Table -AutoSize

          $blocking = @($results | Where-Object {
              $_.Severity -in @('Error', 'ParseError') -or
              ($_.Severity -eq 'Warning' -and $allowedWarningRules -notcontains $_.RuleName)
          })
          if ($blocking.Count -gt 0) {
              Write-Host "::error::PSScriptAnalyzer found $($blocking.Count) blocking issue(s): Error/ParseError severity, or a Warning whose rule is not on the explicit allowlist."
              $blocking | Format-Table -AutoSize
              exit 1
          }

          Write-Host "PSScriptAnalyzer: no Error/ParseError issues, and every Warning found is on the explicit allowlist."

      - name: Run Pester tests
        run: |
          # Force the reviewed Pester 5.7.1: runners can ship legacy Pester 3.4,
          # while PSGallery can publish a newer incompatible major release.
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $pesterVersion = (Get-Module -Name Pester).Version.ToString()
          if ($pesterVersion -ne '5.7.1') {
              throw "Expected Pester 5.7.1, but loaded $pesterVersion."
          }
          Invoke-Pester -Path in-guest/tests -CI

  python-lambda:
    name: Python lambda lint + test
    runs-on: ubuntu-latest
    # As above: pip resolving from PyPI is an unbounded network operation, and
    # nothing in this job legitimately takes minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lambda/max-lifetime-stop/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r lambda/max-lifetime-stop/requirements-dev.txt

      - name: Run ruff
        run: python -m ruff check lambda/

      - name: Run pytest
        run: python -m pytest lambda/ -q
