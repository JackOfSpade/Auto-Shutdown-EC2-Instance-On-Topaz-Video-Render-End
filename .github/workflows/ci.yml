name: CI

on:
  push:
  pull_request:

jobs:
  shell-lint:
    name: Shell + workflow checks (shellcheck, actionlint, auto-merge tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        # --source-path=SCRIPTDIR resolves each `# shellcheck source=` directive
        # relative to the sourcing file's own directory (so tests/ can follow
        # ../scripts/*.sh); without it shellcheck emits SC1091 and fails the job.
        run: shellcheck -x --source-path=SCRIPTDIR control-plane/*.sh control-plane/lib/*.sh scripts/*.sh tests/*.sh

      - name: Run auto-merge decision tests
        run: bash tests/test_auto_merge_logic.sh

      - name: Run control-plane validation tests
        # tests/test_control_plane_validation.sh is being added alongside a new control-plane/lib/
        # directory by a concurrent change; this step targets that fixed path deliberately.
        run: bash tests/test_control_plane_validation.sh

      - name: Run max-lifetime deployment scheduler tests
        run: bash tests/test_deploy_max_lifetime_scheduler.sh

      - name: Run actionlint
        # The shellcheck step above only globs standalone *.sh files — it never sees the bash embedded
        # in the workflows' own `run:` blocks (e.g. the merge loop in auto-merge-claude.yml). actionlint
        # statically checks workflow YAML AND shells out to shellcheck on every embedded `run:` script,
        # so this is the only gate that covers that bash. Pinned to a specific tag (not `:latest`) so a
        # new actionlint release can't silently turn this job red on an unrelated change.
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  powershell:
    name: PowerShell analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # act-local-CI only. GitHub's ubuntu-latest ships PowerShell preinstalled;
      # act's runner image (catthehacker/ubuntu:act-latest) has no pwsh at all, so
      # every step in this job — which defaults to `shell: pwsh` — died with exit
      # 127 ("pwsh: executable file not found in $PATH") under the global
      # `act push` pre-push hook. Since this repo's cloud Actions are disabled,
      # skipping the job locally would leave the PowerShell code with no CI
      # anywhere, so it is installed rather than skipped.
      # `shell: bash` is REQUIRED here and is not redundant: the job-level default
      # is pwsh, which is the very thing that does not exist yet.
      # `env.ACT == 'true'` rather than a bare truthiness test, because GitHub
      # treats ANY non-empty string (including "false") as true; the in-script
      # re-check is a second guard so a misfiring `if:` degrades to a no-op.
      - name: Install PowerShell (act-local CI only — GitHub's runner already has it)
        if: ${{ env.ACT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [ "${ACT:-}" = "true" ] || exit 0
          if ! command -v pwsh >/dev/null 2>&1; then
            ver=7.4.6
            # Match the CONTAINER's arch, not the host's. The pre-push hook runs act
            # with --container-architecture linux/amd64, but a bare `act push` on an
            # Apple Silicon host gets an arm64 container; downloading the wrong
            # tarball fails with a rosetta/ld-linux elf error, not a clear message.
            case "$(uname -m)" in
              x86_64) arch=x64 ;;
              aarch64 | arm64) arch=arm64 ;;
              *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSLo /tmp/pwsh.tar.gz \
              "https://github.com/PowerShell/PowerShell/releases/download/v${ver}/powershell-${ver}-linux-${arch}.tar.gz"
            sudo mkdir -p /opt/microsoft/powershell/7
            sudo tar -xzf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
            sudo chmod +x /opt/microsoft/powershell/7/pwsh
            sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          fi
          pwsh --version

      - name: Install PSScriptAnalyzer + Pester
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # Versions are intentional: PSScriptAnalyzer 1.25.0 is the reviewed
          # version used to establish the warning allowlist below. Pester 5.7.1
          # is the reviewed v5 runner required by this suite's CI interface.
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run PSScriptAnalyzer (Error/ParseError + non-allowlisted Warnings fail the build)
        run: |
          # Install-Module alone does not control module auto-loading when the
          # runner also has another version available. Import and assert the
          # exact reviewed analyzer before evaluating its diagnostics.
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $analyzerVersion = (Get-Module -Name PSScriptAnalyzer).Version.ToString()
          if ($analyzerVersion -ne '1.25.0') {
              throw "Expected PSScriptAnalyzer 1.25.0, but loaded $analyzerVersion."
          }

          # This gate must catch real correctness/best-practice issues, not just parse errors, so
          # Warning severity fails the build too UNLESS the rule is explicitly allowlisted below.
          # Only add a rule here when the in-guest tree triggers it because of a DELIBERATE design
          # choice (verified against the current tree, not assumed) — never to silence a real finding.
          # Never allowlist a security-class rule (credential/secret handling, injection, etc.).
          $allowedWarningRules = @(
              # Config.ps1's best-effort IMDS helpers (Get-Ec2ImdsToken / Get-Ec2Identity) intentionally
              # swallow errors: IMDS being unreachable is an expected, handled case (the caller gets
              # $null), documented in Get-Ec2Identity's own .DESCRIPTION - not a masked bug.
              'PSAvoidUsingEmptyCatchBlock',
              # Watchdog.ps1 and Config.ps1 helper names intentionally describe what they return
              # rather than following the strict singular-noun convention: Get-TopazPids/-TopazWorkers
              # return arrays, Get-OutputBytes returns a byte total, and Build-AwsCliArgs returns an
              # argument list - "Pid"/"Worker"/"Byte"/"Arg" would misdescribe the value.
              'PSUseSingularNouns'
          )

          $results = Invoke-ScriptAnalyzer -Path in-guest -Recurse
          $results | Format-Table -AutoSize

          $blocking = @($results | Where-Object {
              $_.Severity -in @('Error', 'ParseError') -or
              ($_.Severity -eq 'Warning' -and $allowedWarningRules -notcontains $_.RuleName)
          })
          if ($blocking.Count -gt 0) {
              Write-Host "::error::PSScriptAnalyzer found $($blocking.Count) blocking issue(s): Error/ParseError severity, or a Warning whose rule is not on the explicit allowlist."
              $blocking | Format-Table -AutoSize
              exit 1
          }

          Write-Host "PSScriptAnalyzer: no Error/ParseError issues, and every Warning found is on the explicit allowlist."

      - name: Run Pester tests
        run: |
          # Force the reviewed Pester 5.7.1: runners can ship legacy Pester 3.4,
          # while PSGallery can publish a newer incompatible major release.
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $pesterVersion = (Get-Module -Name Pester).Version.ToString()
          if ($pesterVersion -ne '5.7.1') {
              throw "Expected Pester 5.7.1, but loaded $pesterVersion."
          }
          Invoke-Pester -Path in-guest/tests -CI

  python-lambda:
    name: Python lambda lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r lambda/max-lifetime-stop/requirements-dev.txt

      - name: Run ruff
        run: python -m ruff check lambda/

      - name: Run pytest
        run: python -m pytest lambda/ -q
